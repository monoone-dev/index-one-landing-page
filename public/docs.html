<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IndexOne documentation has moved</title>
  <meta name="description" content="The IndexOne documentation now lives at index-one.io/docs/, with one page per topic.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://index-one.io/docs/">
  <meta property="og:title" content="IndexOne documentation">
  <meta property="og:url" content="https://index-one.io/docs/">
  <meta property="og:image" content="https://index-one.io/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
  <!-- Old links pointed at docs.html#<topic>; send each to its own page. Without JS, the refresh below goes to /docs/. -->
  <script>
    (function () {
      var moved = {
        "welcome": "welcome", "first-recording": "first-recording", "upgrading": "install-and-updates",
        "spaces": "workspaces", "dashboards": "projects", "imports": "imports-and-export", "tasks": "tasks-and-reminders",
        "capture": "recording", "translation": "languages", "ivy": "ivy", "ivy-capabilities": "ivy-tools",
        "ivy-page": "ivy-tools", "receipts": "receipts", "notes-graph": "graph-and-analytics", "analytics": "graph-and-analytics",
        "notes-editor": "notes", "shared-ivy": "organizations", "providers": "ai-models", "integrations-apps": "mcp",
        "settings": "settings", "backups": "backups", "shortcuts": "shortcuts", "diagnostics": "diagnostics",
        "data-flow": "data-flow", "protection": "app-lock", "lock-model": "lock-model",
        "redaction-firewall": "redaction", "known-limitations": "known-limitations"
      };
      var hash = (location.hash || "").replace(/^#(doc-)?/, "");
      location.replace(moved[hash] ? "/docs/" + moved[hash] + "/" : "/docs/");
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/docs/">
</head>
<body>
  <h1>IndexOne documentation has moved</h1>
  <p>The documentation is now at <a href="/docs/">index-one.io/docs/</a>.</p>
</body>
</html>
